<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Circular White Background with Soft Border -->
  <circle cx="120" cy="120" r="114" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  
  <!-- Four Diamond Cross Geometry -->
  <!-- Top Diamond: Crimson Red Accent (#DC2626) -->
  <polygon points="120,38 148,66 120,94 92,66" fill="#DC2626" />
  
  <!-- Bottom Diamond: Dark Onyx (#111827) -->
  <polygon points="120,118 148,146 120,174 92,146" fill="#111827" />
  
  <!-- Left Diamond: Dark Onyx (#111827) -->
  <polygon points="66,78 94,106 66,134 38,106" fill="#111827" />
  
  <!-- Right Diamond: Dark Onyx (#111827) -->
  <polygon points="174,78 202,106 174,134 146,106" fill="#111827" />
  
  <!-- Dividing Lines in White -->
  <line x1="58" y1="58" x2="182" y2="154" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="182" y1="58" x2="58" y2="154" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Text: HEDGE COMPUTERS -->
  <text x="120" y="196" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#111827" text-anchor="middle" letter-spacing="1">HEDGE</text>
  <text x="120" y="216" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#DC2626" text-anchor="middle" letter-spacing="2">COMPUTERS</text>
</svg>
