<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="silverRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86868b"/>
      <stop offset="50%" stop-color="#555558"/>
      <stop offset="100%" stop-color="#3a3a3c"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="50%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="screenGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="335" rx="140" ry="12" fill="#000000" opacity="0.5" filter="blur(8px)"/>

  <!-- Laptop Display Lid -->
  <rect x="75" y="90" width="250" height="165" rx="14" fill="url(#lidGrad)" stroke="url(#silverRim)" stroke-width="2.5"/>
  <!-- Display Screen Bezel & Glass -->
  <rect x="83" y="98" width="234" height="149" rx="8" fill="#0c0c0e"/>
  <!-- Screen Reflection -->
  <path d="M83 110 C 83 103, 89 98, 96 98 L 220 98 L 83 235 Z" fill="url(#screenGloss)"/>

  <!-- Display Center Logo -->
  <g transform="translate(200, 172) scale(0.6)">
    <circle cx="0" cy="0" r="24" fill="#232326" stroke="#3e3e42" stroke-width="1.2"/>
    <path d="M-8 11 L0 -11 L8 11" stroke="#f5f5f7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-5" y1="3" x2="5" y2="3" stroke="#86868b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Laptop Base Chassis -->
  <path d="M40 262 L360 262 L342 284 C340 286 337 287 334 287 L66 287 C63 287 60 286 58 284 Z" fill="url(#baseGrad)" stroke="url(#silverRim)" stroke-width="1.5"/>
  <!-- Base Top Plate & Trackpad cutout line -->
  <rect x="42" y="260" width="316" height="5" rx="2" fill="#48484a"/>
  <rect x="175" y="261" width="50" height="2" rx="1" fill="#1c1c1e"/>
  <!-- Bottom Lip Notch for Opening -->
  <rect x="180" y="266" width="40" height="4" rx="2" fill="#1c1c1e"/>
</svg>
