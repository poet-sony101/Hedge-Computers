<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="chargerBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="50%" stop-color="#242426"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#48484a"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="345" rx="75" ry="12" fill="#000000" opacity="0.4" filter="blur(6px)"/>

  <!-- Power Brick Chassis -->
  <rect x="135" y="100" width="130" height="210" rx="28" fill="url(#chargerBody)" stroke="url(#metalRim)" stroke-width="2.5"/>

  <!-- USB-C Port Cutouts -->
  <rect x="175" y="130" width="50" height="14" rx="7" fill="#09090b" stroke="#48484a" stroke-width="1.5"/>
  <rect x="186" y="135" width="28" height="4" rx="2" fill="#8e8e93"/>

  <rect x="175" y="160" width="50" height="14" rx="7" fill="#09090b" stroke="#48484a" stroke-width="1.5"/>
  <rect x="186" y="165" width="28" height="4" rx="2" fill="#8e8e93"/>

  <!-- Monogram Brand Mark -->
  <g transform="translate(200, 240) scale(0.6)">
    <circle cx="0" cy="0" r="22" fill="#242426" stroke="#3a3a3c" stroke-width="1.2"/>
    <path d="M-7 9 L0 -9 L7 9" stroke="#f5f5f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-4" y1="2" x2="4" y2="2" stroke="#86868b" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
